[project]
name = "harness-matrix"
version = "0.1.0"
description = "Harness-agnostic agent evaluation: hold the model constant, vary the harness, measure what moves."
authors = [{ name = "Sofiane", email = "sofianebouabdallahh@gmail.com" }]
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agentdojo>=0.1.35",
    "anthropic>=2.3.0",
    "claude-agent-sdk>=0.2.174",
    "httpx>=0.28.1",
    "mcp>=1.10",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "starlette>=1.9.0",
    "tau2",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
hm = "hm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hm"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "v1.0.1" }

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
